name: behavioral-quality

# Shared by routine CI and tag releases so both use the same behavioral gate.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: taiki-e/install-action@just
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ccsds-ndm
      - name: Install XSD validator
        run: |
          sudo apt-get update
          sudo apt-get install --yes libxml2-utils
      - name: Run tests
        run: just test-rust

  python-bindings:
    name: Python bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v5
      - uses: taiki-e/install-action@just
      - name: Set up Python environment
        run: just setup-dev
      - name: Build Python extension
        run: just dev
      - name: Lint Python
        run: just lint-python
      - name: Audit bindings
        run: just audit
      - name: Check stubs
        run: just stubs-check
      - name: Run Python tests
        run: just test-python
