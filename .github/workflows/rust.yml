name: Rust

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@just
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ccsds-ndm
      - name: Run tests
        run: just test-rust

  fmt:
    name: Linting - Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@just

      - name: Enforce formatting
        run: just fmt-rust-check

      - name: Linting
        run: just lint-rust
  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: taiki-e/install-action@just
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate code coverage
        run: just coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
          files: ccsds-ndm/codecov.json
          fail_ci_if_error: true

  bindings:
    name: Python Bindings Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - uses: taiki-e/install-action@just
      - name: Set up Python environment
        run: just setup-dev
      - name: Build Python extension
        run: just dev
      - name: Lint Python
        run: just lint-python
      - name: Audit bindings
        run: just audit-strict
      - name: Check stubs
        run: just stubs-check
      - name: Check synced docstrings
        run: just sync-docs-check
      - name: Run Python tests
        run: just test-python

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, fmt, coverage, bindings]
    if: github.ref_type == 'tag'
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Publish to crates.io
        working-directory: ./ccsds-ndm
        env:
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: cargo publish --token ${CRATES_TOKEN}
