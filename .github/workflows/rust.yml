name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Behavioral quality
    uses: ./.github/workflows/behavioral-quality.yml

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Check the published library
        # No --locked: Cargo.lock is not tracked, so a clean checkout has no lock file to honor.
        run: cargo check --manifest-path ccsds-ndm/Cargo.toml --lib

  fmt:
    name: Linting - Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@just

      - name: Enforce formatting
        run: just fmt-rust-check

      - name: Linting
        run: just lint-rust
