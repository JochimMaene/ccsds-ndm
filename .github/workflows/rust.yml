name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Behavioral quality
    uses: ./.github/workflows/behavioral-quality.yml

  package-rust:
    name: Verify Rust crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: taiki-e/install-action@just
      - name: Install XSD validator
        run: |
          sudo apt-get update
          sudo apt-get install --yes libxml2-utils
      - name: Build and verify crate package
        run: just package-rust

  package-python:
    name: Verify Python wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v5
      - uses: taiki-e/install-action@just
      - name: Build, install, and verify wheel
        run: just package-python
