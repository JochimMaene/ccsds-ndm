[package]
name = "ccsds-ndm-py"
version = "0.0.9"
authors = ["Jochim Maene <jochim.maene+github@gmail.com>"]
edition = "2021"
description = "Python bindings for ccsds-ndm"
license = "MPL-2.0"
repository = "https://github.com/JochimMaene/ccsds-ndm"

[lib]
name = "ccsds_ndm_py"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "stub_gen"

[dependencies]
ccsds-ndm = { path = "../../ccsds-ndm" }
numpy = "0.29.0"
# `extension-module` is supplied by maturin via pyproject.toml so that non-maturin
# builds (the stub generator) can link against libpython.
pyo3 = { version = "0.29.2", features = ["abi3-py310"] }
pyo3-stub-gen = "0.23.0"
