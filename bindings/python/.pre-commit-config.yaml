fail_fast: true
default_install_hook_types: [pre-commit,pre-push]
exclude: |
  (?x)^(
    .*/(snapshots)/.*|
  )$

repos:
  - repo: local
    hooks:
      - id: local-ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude --fix --exit-non-zero-on-fix
        require_serial: true
        language: unsupported
        types: [python]

      - id: local-ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude --exit-non-zero-on-format
        require_serial: true
        language: unsupported
        types: [python]

      - id: local-stub-check
        name: stub check
        entry: uv run python stubs.py --check
        language: system
        pass_filenames: false
        always_run: true

      - id: sync-docstrings
        name: sync docstrings check
        entry: uv run python sync_docstrings.py --check
        language: system
        pass_filenames: false
        files: ^(src/.*\.rs|../../ccsds-ndm/src/.*)$

      - id: audit-bindings
        name: audit bindings
        entry: uv run python audit_bindings.py --strict
        language: system
        pass_filenames: false
        files: ^(src/.*\.rs|../../ccsds-ndm/src/.*)$
